<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Caixa Pro">
<title>Caixa Pro</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
background:#f3f4f6;
color:#111827;
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
padding-bottom:90px;
}

header{
background:#111827;
color:white;
padding:25px 16px 14px;
position:sticky;
top:0;
z-index:5;
}

header h1{
margin:0;
font-size:21px;
}

main{
max-width:700px;
margin:auto;
padding:14px;
}

.card{
background:white;
border-radius:16px;
padding:16px;
margin-bottom:12px;
box-shadow:0 2px 8px #0001;
}

input,select,button{
width:100%;
padding:13px;
border-radius:11px;
border:1px solid #d1d5db;
font-size:16px;
background:white;
margin:5px 0;
}

button{
background:#111827;
color:white;
border:0;
font-weight:bold;
}

button:active{
transform:scale(.98);
}

.danger{
background:#dc2626;
}

.green{
background:#16a34a;
}

.blue{
background:#2563eb;
}

.gray{
background:#e5e7eb;
color:#111827;
}

.orange{
background:#ea580c;
}

.grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
}

.valor{
font-size:24px;
font-weight:bold;
}

.grande{
font-size:30px;
font-weight:bold;
}

.muted{
color:#6b7280;
}

.center{
text-align:center;
}

.hidden{
display:none;
}

.item{
display:flex;
justify-content:space-between;
align-items:center;
gap:10px;
padding:12px 0;
border-bottom:1px solid #eee;
}

.item:last-child{
border-bottom:0;
}

.item button{
width:auto;
padding:8px 10px;
font-size:13px;
}

.badge{
display:inline-block;
padding:5px 8px;
border-radius:8px;
font-size:12px;
font-weight:bold;
}

.badge-green{
background:#dcfce7;
color:#166534;
}

.badge-red{
background:#fee2e2;
color:#991b1b;
}

.badge-yellow{
background:#fef3c7;
color:#92400e;
}

.badge-blue{
background:#dbeafe;
color:#1e40af;
}

nav{
position:fixed;
bottom:0;
left:0;
right:0;
background:white;
border-top:1px solid #ddd;
padding:8px;
display:grid;
grid-template-columns:repeat(5,1fr);
z-index:10;
padding-bottom:calc(8px + env(safe-area-inset-bottom));
}

nav button{
background:white;
color:#374151;
font-size:11px;
margin:0;
padding:7px 2px;
}

hr{
border:0;
border-top:1px solid #eee;
margin:15px 0;
}

.resumo{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
}

.resumoBox{
background:#f9fafb;
border-radius:12px;
padding:12px;
}

.troco{
background:#dcfce7;
color:#166534;
padding:14px;
border-radius:12px;
font-size:22px;
font-weight:bold;
text-align:center;
margin:10px 0;
}

.negativo{
background:#fee2e2;
color:#991b1b;
}

.lista{
max-height:500px;
overflow:auto;
}

@media(max-width:430px){
.grid{
grid-template-columns:1fr;
}
}
</style>
</head>

<body>

<!-- LOGIN -->

<div id="login" style="padding:35px 18px">

<div class="card">

<h1 class="center">🧾 Caixa Pro</h1>

<p class="center muted">
Controle de Caixa
</p>

<input id="usuario"
placeholder="Usuário"
autocomplete="username">

<input id="senha"
type="password"
placeholder="Senha"
autocomplete="current-password">

<button onclick="entrar()">
🔐 Entrar
</button>

<p class="center muted">
Primeiro acesso: admin / 1234
</p>

</div>

</div>


<!-- APLICATIVO -->

<div id="app" class="hidden">

<header>

<h1>🧾 Caixa Pro</h1>

<div id="operador"></div>

</header>

<main id="tela"></main>

<nav>

<button onclick="pagina('inicio')">
🏠<br>Início
</button>

<button onclick="pagina('venda')">
🛒<br>Venda
</button>

<button onclick="pagina('produtos')">
📦<br>Produtos
</button>

<button onclick="pagina('clientes')">
👥<br>Clientes
</button>

<button onclick="pagina('caixa')">
💰<br>Caixa
</button>

</nav>

</div>


<script>

/* =====================================================
   BANCO DE DADOS
===================================================== */

let banco =
JSON.parse(localStorage.getItem("CAIXA_PRO") || "null")
||
{
produtos:[],
clientes:[],
vendas:[],
movimentos:[],
fechamentos:[],
caixa:null
};


/* =====================================================
   OPERADORES
===================================================== */

let operadores =
JSON.parse(localStorage.getItem("CAIXA_OPERADORES") || "null")
||
[
{
nome:"Administrador",
usuario:"admin",
senha:"1234"
}
];


let usuarioAtual="";
let carrinho=[];


/* =====================================================
   CORREÇÃO DE DADOS
===================================================== */

if(!banco.produtos)banco.produtos=[];
if(!banco.clientes)banco.clientes=[];
if(!banco.vendas)banco.vendas=[];
if(!banco.movimentos)banco.movimentos=[];
if(!banco.fechamentos)banco.fechamentos=[];

if(!operadores.length){

operadores.push({
nome:"Administrador",
usuario:"admin",
senha:"1234"
});

}


/* =====================================================
   SALVAR
===================================================== */

function salvar(){

localStorage.setItem(
"CAIXA_PRO",
JSON.stringify(banco)
);

localStorage.setItem(
"CAIXA_OPERADORES",
JSON.stringify(operadores)
);

}


/* =====================================================
   FORMATAÇÃO DE DINHEIRO
===================================================== */

function dinheiro(valor){

return new Intl.NumberFormat(
"pt-BR",
{
style:"currency",
currency:"BRL"
}
).format(Number(valor)||0);

}


/* =====================================================
   DATA
===================================================== */

function dataHora(data){

return new Date(data).toLocaleString(
"pt-BR"
);

}


/* =====================================================
   LOGIN
===================================================== */

function entrar(){

let u =
document.getElementById("usuario")
.value
.trim();

let s =
document.getElementById("senha")
.value;

let op =
operadores.find(
x =>
x.usuario === u &&
x.senha === s
);

if(!op){

alert("Usuário ou senha incorretos.");

return;

}

usuarioAtual=op.nome;

document
.getElementById("login")
.classList.add("hidden");

document
.getElementById("app")
.classList.remove("hidden");

document
.getElementById("operador")
.innerText =
"Operador: "+usuarioAtual;

pagina("inicio");

}


/* =====================================================
   NAVEGAÇÃO
===================================================== */

function pagina(p){

if(p==="inicio")inicio();

if(p==="venda")venda();

if(p==="produtos")produtos();

if(p==="clientes")clientes();

if(p==="caixa")caixa();

}


/* =====================================================
   INÍCIO
===================================================== */

function inicio(){

let ativas =
banco.vendas.filter(
v=>!v.cancelada
);

let faturamento =
ativas.reduce(
(a,v)=>a+Number(v.total),
0
);

let dinheiroTotal =
ativas
.filter(v=>v.pagamento==="Dinheiro")
.reduce(
(a,v)=>a+Number(v.total),
0
);

tela.innerHTML=`

<div class="card">

<h2>📊 Resumo</h2>

<div class="resumo">

<div class="resumoBox">

<span class="muted">
Vendas
</span>

<div class="valor">
${ativas.length}
</div>

</div>

<div class="resumoBox">

<span class="muted">
Faturamento
</span>

<div class="valor">
${dinheiro(faturamento)}
</div>

</div>

</div>

</div>


<div class="card">

<h3>💰 Status do caixa</h3>

<h2>
${banco.caixa
?"🟢 CAIXA ABERTO"
:"🔴 CAIXA FECHADO"}
</h2>

${
banco.caixa
?
`
<p>
Troco inicial:
<b>
${dinheiro(banco.caixa.inicial)}
</b>
</p>
`
:
""
}

<button
onclick="pagina('venda')">

🛒 Nova venda

</button>

</div>


<div class="card">

<h3>📈 Vendas em dinheiro</h3>

<div class="valor">
${dinheiro(dinheiroTotal)}
</div>

</div>


<div class="card">

<h3>🧾 Últimas vendas</h3>

<div class="lista">

${
banco.vendas
.slice()
.reverse()
.slice(0,10)
.map(v=>`

<div class="item">

<span>

<b>
${v.pagamento}
</b>

<br>

<small>
${dataHora(v.data)}
</small>

<br>

${
v.cancelada
?
`
<span class="badge badge-red">
CANCELADA
</span>
`
:
`
<span class="badge badge-green">
ATIVA
</span>
`
}

</span>


<span style="text-align:right">

<b>
${dinheiro(v.total)}
</b>

<br>

${
!v.cancelada
?
`
<button
class="danger"
onclick="cancelarVenda(${v.id})">

Cancelar

</button>
`
:
""
}

</span>

</div>

`)
.join("")
||
"<p class='muted'>Nenhuma venda.</p>"
}

</div>

</div>

`;

}


/* =====================================================
   VENDA
===================================================== */

function venda(){

let total =
carrinho.reduce(
(a,x)=>a+(x.preco*x.qtd),
0
);

tela.innerHTML=`

<div class="card">

<h2>🛒 Nova Venda</h2>

${
!banco.caixa
?
`
<div class="badge badge-red">
CAIXA FECHADO
</div>

<p>
Abra o caixa antes de realizar uma venda.
</p>

<button
onclick="pagina('caixa')">

💰 Abrir caixa

</button>
`
:
""
}

<input
id="busca"
placeholder="Nome ou código do produto">

<div class="grid">

<input
id="quantidade"
type="number"
value="1"
min="1">

<button
onclick="adicionar()">

➕ Adicionar

</button>

</div>

</div>


<div class="card">

<h3>🛒 Carrinho</h3>

${
carrinho.map((x,i)=>`

<div class="item">

<span>

<b>
${x.nome}
</b>

<br>

<small>
${x.qtd} × ${dinheiro(x.preco)}
</small>

</span>


<span style="text-align:right">

<b>
${dinheiro(x.preco*x.qtd)}
</b>

<br>

<button
class="danger"
onclick="remover(${i})">

Remover

</button>

</span>

</div>

`)
.join("")
||
"<p class='muted'>Carrinho vazio.</p>"
}

<hr>

<h2>
TOTAL: ${dinheiro(total)}
</h2>


<select id="pagamento"
onchange="atualizarPagamento()">

<option>Dinheiro</option>

<option>Pix</option>

<option>Cartão de débito</option>

<option>Cartão de crédito</option>

<option>Fiado</option>

</select>


<div id="areaDinheiro">

<input
id="recebido"
type="number"
step="0.01"
inputmode="decimal"
placeholder="💵 Valor recebido">

<div id="trocoVenda"
class="troco">

Troco: R$ 0,00

</div>

</div>


<button
class="green"
onclick="finalizar()">

✅ Finalizar venda

</button>

<button
class="gray"
onclick="limparCarrinho()">

🗑️ Limpar venda

</button>

</div>

`;

}


/* =====================================================
   PAGAMENTO
===================================================== */

function atualizarPagamento(){

let pag =
document.getElementById("pagamento").value;

let area =
document.getElementById("areaDinheiro");

if(pag==="Dinheiro"){

area.style.display="block";

}
else{

area.style.display="none";

}

}


/* =====================================================
   TROCO AUTOMÁTICO
===================================================== */

document.addEventListener(
"input",
function(e){

if(e.target.id!=="recebido")
return;

if(!document.getElementById("trocoVenda"))
return;

let total =
carrinho.reduce(
(a,x)=>a+x.preco*x.qtd,
0
);

let recebido =
parseFloat(e.target.value)||0;

let troco =
recebido-total;

let elemento =
document.getElementById("trocoVenda");

if(recebido<total){

elemento.className="troco negativo";

elemento.innerText =
"Falta: "+dinheiro(total-recebido);

}
else{

elemento.className="troco";

elemento.innerText =
"Troco: "+dinheiro(troco);

}

});


/* =====================================================
   ADICIONAR AO CARRINHO
===================================================== */

function adicionar(){

let texto =
document
.getElementById("busca")
.value
.trim()
.toLowerCase();

let qtd =
Math.max(
1,
parseInt(
document
.getElementById("quantidade")
.value
)||1
);

if(!texto){

alert(
"Digite o nome ou código do produto."
);

return;

}

let p =
banco.produtos.find(
x =>
x.nome.toLowerCase()===texto ||
String(x.codigo)===texto
);

if(!p){

alert(
"Produto não encontrado."
);

return;

}

if(p.estoque<qtd){

alert(
"Estoque insuficiente."
);

return;

}

let existente =
carrinho.find(
x=>x.id===p.id
);

if(existente){

if(
existente.qtd+qtd >
p.estoque
){

alert(
"Quantidade maior que o estoque."
);

return;

}

existente.qtd+=qtd;

}
else{

carrinho.push({

id:p.id,

nome:p.nome,

preco:Number(p.preco),

qtd:qtd

});

}

venda();

}


/* =====================================================
   REMOVER ITEM
===================================================== */

function remover(i){

carrinho.splice(i,1);

venda();

}


/* =====================================================
   LIMPAR CARRINHO
===================================================== */

function limparCarrinho(){

if(!carrinho.length)
return;

if(
!confirm(
"Limpar todos os produtos desta venda?"
)
)
return;

carrinho=[];

venda();

}


/* =====================================================
   FINALIZAR VENDA
===================================================== */

function finalizar(){

if(!banco.caixa){

alert(
"Abra o caixa antes de vender."
);

return;

}

if(!carrinho.length){

alert(
"Carrinho vazio."
);

return;

}

let total =
carrinho.reduce(
(a,x)=>a+x.preco*x.qtd,
0
);

let pag =
document
.getElementById("pagamento")
.value;

let rec =
pag==="Dinheiro"
?
parseFloat(
document
.getElementById("recebido")
.value
)||0
:
total;


if(
pag==="Dinheiro" &&
rec<total
){

alert(
"Valor recebido menor que o total."
);

return;

}


let cliente="";

if(pag==="Fiado"){

cliente =
prompt(
"Nome do cliente:"
);

if(!cliente)
return;

}


/* Guardar itens */

let itens =
carrinho.map(x=>({

id:x.id,

nome:x.nome,

preco:x.preco,

qtd:x.qtd

}));


/* Baixar estoque */

carrinho.forEach(x=>{

let p =
banco.produtos.find(
p=>p.id===x.id
);

if(p){

p.estoque-=x.qtd;

}

});


let novaVenda={

id:Date.now(),

data:new Date().toISOString(),

operador:usuarioAtual,

caixaId:banco.caixa.id,

total:total,

pagamento:pag,

recebido:rec,

troco:
pag==="Dinheiro"
?
rec-total
:
0,

cliente:cliente,

itens:itens,

cancelada:false

};


banco.vendas.push(
novaVenda
);

salvar();


alert(
"✅ VENDA REALIZADA\n\n"+
"Total: "+dinheiro(total)+
"\nRecebido: "+dinheiro(rec)+
"\nTroco: "+dinheiro(novaVenda.troco)
);


carrinho=[];

pagina("venda");

}


/* =====================================================
   CANCELAR VENDA
===================================================== */

function cancelarVenda(id){

let v =
banco.vendas.find(
x=>x.id===id
);

if(!v){

alert(
"Venda não encontrada."
);

return;

}

if(v.cancelada){

alert(
"Essa venda já está cancelada."
);

return;

}


let motivo =
prompt(
"Informe o motivo do cancelamento:"
);

if(motivo===null)
return;

motivo=motivo.trim();

if(!motivo){

alert(
"Informe o motivo."
);

return;

}


let confirmar =
confirm(
"⚠️ CONFIRMAR CANCELAMENTO?\n\n"+
"Valor: "+dinheiro(v.total)+
"\nPagamento: "+v.pagamento+
"\n\nMotivo: "+motivo+
"\n\nOs produtos voltarão ao estoque."
);

if(!confirmar)
return;


/* Devolver estoque */

if(v.itens){

v.itens.forEach(item=>{

let p =
banco.produtos.find(
p=>p.id===item.id
);

if(p){

p.estoque+=item.qtd;

}

});

}


/* Registrar cancelamento */

v.cancelada=true;

v.motivoCancelamento=
motivo;

v.canceladaEm=
new Date().toISOString();

v.canceladaPor=
usuarioAtual;


salvar();


alert(
"✅ VENDA CANCELADA\n\n"+
"Produtos devolvidos ao estoque."
);


inicio();

}


/* =====================================================
   PRODUTOS
===================================================== */

function produtos(){

tela.innerHTML=`

<div class="card">

<h2>📦 Produtos</h2>

<input
id="pnome"
placeholder="Nome do produto">

<input
id="pcodigo"
placeholder="Código de barras">

<input
id="ppreco"
type="number"
step="0.01"
inputmode="decimal"
placeholder="Preço de venda">

<input
id="pestoque"
type="number"
inputmode="numeric"
placeholder="Quantidade em estoque">

<button
class="green"
onclick="cadastrarProduto()">

➕ Cadastrar produto

</button>

</div>


<div class="card">

<h3>
📦 Produtos cadastrados
</h3>

<div class="lista">

${
banco.produtos.map(p=>`

<div class="item">

<span>

<b>
${p.nome}
</b>

<br>

<small>
Código: ${p.codigo||"-"}
<br>
Estoque: ${p.estoque}
</small>

</span>


<span style="text-align:right">

<b>
${dinheiro(p.preco)}
</b>

<br>

<button
onclick="editarProduto(${p.id})">

Editar

</button>

<button
class="danger"
onclick="removerProduto(${p.id})">

Excluir

</button>

</span>

</div>

`)
.join("")
||
"<p class='muted'>Nenhum produto cadastrado.</p>"
}

</div>

</div>

`;

}


/* =====================================================
   CADASTRAR PRODUTO
===================================================== */

function cadastrarProduto(){

let nome =
document
.getElementById("pnome")
.value
.trim();

let codigo =
document
.getElementById("pcodigo")
.value
.trim();

let preco =
parseFloat(
document
.getElementById("ppreco")
.value
);

let estoque =
parseInt(
document
.getElementById("pestoque")
.value
)||0;


if(!nome){

alert(
"Informe o nome."
);

return;

}

if(!(preco>0)){

alert(
"Informe um preço válido."
);

return;

}


banco.produtos.push({

id:Date.now(),

nome:nome,

codigo:codigo,

preco:preco,

estoque:estoque

});


salvar();

alert(
"Produto cadastrado."
);

produtos();

}


/* =====================================================
   EDITAR PRODUTO
===================================================== */

function editarProduto(id){

let p =
banco.produtos.find(
x=>x.id===id
);

if(!p)
return;


let nome =
prompt(
"Nome do produto:",
p.nome
);

if(nome===null)
return;


let codigo =
prompt(
"Código de barras:",
p.codigo||""
);

if(codigo===null)
return;


let preco =
parseFloat(
prompt(
"Preço de venda:",
p.preco
)
);

if(!(preco>0)){

alert(
"Preço inválido."
);

return;

}


let estoque =
parseInt(
prompt(
"Estoque:",
p.estoque
)
);

if(isNaN(estoque)){

alert(
"Estoque inválido."
);

return;

}


p.nome=nome.trim();

p.codigo=codigo.trim();

p.preco=preco;

p.estoque=estoque;


salvar();

produtos();

}


/* =====================================================
   EXCLUIR PRODUTO
===================================================== */

function removerProduto(id){

let p =
banco.produtos.find(
x=>x.id===id
);

if(!p)
return;


let usado =
banco.vendas.some(
v =>
v.itens &&
v.itens.some(
i=>i.id===id
)
);


let mensagem =
usado
?
"Este produto já aparece em vendas.\n\nExcluir mesmo assim?"
:
"Excluir o produto '"+p.nome+"'?";


if(!confirm(mensagem))
return;


banco.produtos =
banco.produtos.filter(
x=>x.id!==id
);


salvar();

produtos();

}


/* =====================================================
   CLIENTES
===================================================== */

function clientes(){

tela.innerHTML=`

<div class="card">

<h2>👥 Clientes</h2>

<input
id="cnome"
placeholder="Nome">

<input
id="ctelefone"
placeholder="Telefone"
inputmode="tel">

<button
class="green"
onclick="cadastrarCliente()">

➕ Cadastrar cliente

</button>

</div>


<div class="card">

<h3>
Clientes cadastrados
</h3>

${
banco.clientes.map((c,i)=>`

<div class="item">

<span>

<b>
${c.nome}
</b>

<br>

<small>
${c.telefone||"Sem telefone"}
</small>

</span>

<button
class="danger"
onclick="removerCliente(${i})">

Excluir

</button>

</div>

`)
.join("")
||
"<p class='muted'>Nenhum cliente.</p>"
}

</div>

`;

}


/* =====================================================
   CADASTRAR CLIENTE
===================================================== */

function cadastrarCliente(){

let nome =
document
.getElementById("cnome")
.value
.trim();

let telefone =
document
.getElementById("ctelefone")
.value
.trim();

if(!nome){

alert(
"Informe o nome."
);

return;

}


banco.clientes.push({

id:Date.now(),

nome:nome,

telefone:telefone

});


salvar();

clientes();

}


/* =====================================================
   REMOVER CLIENTE
===================================================== */

function removerCliente(i){

if(
!confirm(
"Excluir este cliente?"
)
)
return;

banco.clientes.splice(
i,
1
);

salvar();

clientes();

}


/* =====================================================
   CALCULAR SALDO DO CAIXA
===================================================== */

function calcularSaldoCaixa(){

if(!banco.caixa)
return 0;

let saldo =
Number(
banco.caixa.inicial
)||0;


/* Vendas em dinheiro */

banco.vendas
.filter(
v =>
!v.cancelada &&
v.pagamento==="Dinheiro" &&
v.caixaId===banco.caixa.id
)
.forEach(v=>{

saldo +=
Number(v.total)||0;

});


/* Entradas e saídas */

banco.movimentos
.filter(
m=>m.caixaId===banco.caixa.id
)
.forEach(m=>{

if(m.tipo==="Entrada")
saldo+=Number(m.valor)||0;

if(m.tipo==="Saída")
saldo-=Number(m.valor)||0;

});


return saldo;

}


/* =====================================================
   CAIXA
===================================================== */

function caixa(){

let saldo =
calcularSaldoCaixa();


tela.innerHTML=`

<div class="card">

<h2>💰 Controle de Caixa</h2>

${
banco.caixa
?
`

<div class="badge badge-green">
🟢 CAIXA ABERTO
</div>

<p>
Operador:
<b>
${banco.caixa.operador}
</b>
</p>

<p>
Aberto em:
<br>
${dataHora(banco.caixa.abertura)}
</p>

<hr>

<p>
Troco / valor inicial
</p>

<div class="valor">
${dinheiro(banco.caixa.inicial)}
</div>

<p>
Saldo esperado
</p>

<div class="grande">
${dinheiro(saldo)}
</div>

<input
id="contado"
type="number"
step="0.01"
inputmode="decimal"
placeholder="💵 Dinheiro contado no caixa">

<button
class="danger"
onclick="fecharCaixa()">

🔒 Fechar caixa

</button>

`
:
`

<div class="badge badge-red">
🔴 CAIXA FECHADO
</div>

<p>
Informe o dinheiro que ficará no caixa como troco inicial.
</p>

<input
id="inicial"
type="number"
step="0.01"
inputmode="decimal"
placeholder="💵 Troco / valor inicial">

<button
class="green"
onclick="abrirCaixa()">

🔓 Abrir caixa

</button>

`
}

</div>


${
banco.caixa
?
`

<div class="card">

<h3>
💵 Movimentação
</h3>

<button
onclick="movimento('Entrada')">

➕ Entrada de dinheiro

</button>

<button
class="gray"
onclick="movimento('Saída')">

➖ Saída de dinheiro

</button>

</div>

`
:
""
}


${
banco.caixa
?
`

<div class="card">

<h3>
📋 Movimentações do caixa
</h3>

<div class="lista">

${
banco.movimentos
.filter(
m=>m.caixaId===banco.caixa.id
)
.slice()
.reverse()
.map(m=>`

<div class="item">

<span>

<b>
${m.tipo}
</b>

<br>

<small>
${dataHora(m.data)}
</small>

<br>

<small>
${m.descricao||"Sem descrição"}
</small>

</span>

<span>

<b>
${m.tipo==="Entrada"?"+":"-"}
${dinheiro(m.valor)}
</b>

</span>

</div>

`)
.join("")
||
"<p class='muted'>Nenhuma movimentação.</p>"
}

</div>

</div>

`
:
""
}


<div class="card">

<h3>
👤 Operadores
</h3>

<button
onclick="gerenciarOperadores()">

⚙️ Gerenciar operadores

</button>

</div>


<div class="card">

<h3>
📊 Relatório
</h3>

<p>
Vendas ativas:
<b>
${banco.vendas.filter(v=>!v.cancelada).length}
</b>
</p>

<p>
Vendas canceladas:
<b>
${banco.vendas.filter(v=>v.cancelada).length}
</b>
</p>

<p>
Produtos:
<b>
${banco.produtos.length}
</b>
</p>

<p>
Clientes:
<b>
${banco.clientes.length}
</b>
</p>

<button
class="blue"
onclick="exportar()">

📥 Exportar vendas CSV

</button>

</div>

`;

}


/* =====================================================
   ABRIR CAIXA
===================================================== */

function abrirCaixa(){

if(banco.caixa){

alert(
"O caixa já está aberto."
);

return;

}


let campo =
document.getElementById("inicial");

let valor =
parseFloat(
campo.value
)||0;


if(valor<0){

alert(
"O valor inicial não pode ser negativo."
);

return;

}


banco.caixa={

id:Date.now(),

inicial:valor,

abertura:
new Date().toISOString(),

operador:
usuarioAtual

};


salvar();


alert(
"✅ CAIXA ABERTO\n\n"+
"Troco inicial: "+
dinheiro(valor)
);


caixa();

}


/* =====================================================
   FECHAR CAIXA
===================================================== */

function fecharCaixa(){

if(!banco.caixa){

alert(
"O caixa já está fechado."
);

return;

}


let esperado =
calcularSaldoCaixa();

let contado =
parseFloat(
document
.getElementById("contado")
.value
)||0;


let diferenca =
contado-esperado;


let confirmar =
confirm(
"CONFIRMAR FECHAMENTO?\n\n"+
"Esperado: "+dinheiro(esperado)+
"\nContado: "+dinheiro(contado)+
"\nDiferença: "+dinheiro(diferenca)
);

if(!confirmar)
return;


let fechamento={

id:Date.now(),

data:
new Date().toISOString(),

caixaId:
banco.caixa.id,

operador:
usuarioAtual,

esperado:
esperado,

contado:
contado,

diferenca:
diferenca

};


banco.fechamentos.push(
fechamento
);

banco.caixa=null;

salvar();


let mensagem =
"🔒 CAIXA FECHADO\n\n"+
"Esperado: "+dinheiro(esperado)+
"\nContado: "+dinheiro(contado)+
"\nDiferença: "+dinheiro(diferenca);


if(diferenca>0){

mensagem +=
"\n\nSobra: "+dinheiro(diferenca);

}

if(diferenca<0){

mensagem +=
"\n\nFalta: "+dinheiro(Math.abs(diferenca));

}

if(diferenca===0){

mensagem +=
"\n\n✅ Caixa conferido corretamente.";

}


alert(mensagem);

caixa();

}


/* =====================================================
   ENTRADA / SAÍDA
===================================================== */

function movimento(tipo){

if(!banco.caixa){

alert(
"Abra o caixa primeiro."
);

return;

}


let valor =
parseFloat(
prompt(
"Valor da "+tipo+":"
)
);


if(!(valor>0))
return;


let descricao =
prompt(
"Descrição da "+tipo+":"
)
||"";


banco.movimentos.push({

id:Date.now(),

caixaId:
banco.caixa.id,

tipo:tipo,

valor:valor,

descricao:descricao,

operador:
usuarioAtual,

data:
new Date().toISOString()

});


salvar();

alert(
tipo+" registrada: "+dinheiro(valor)
);

caixa();

}


/* =====================================================
   OPERADORES
===================================================== */

function gerenciarOperadores(){

if(usuarioAtual!=="Administrador"){

alert(
"Somente o Administrador pode gerenciar operadores."
);

return;

}


tela.innerHTML=`

<div class="card">

<h2>
👤 Operadores
</h2>

<input
id="novoNome"
placeholder="Nome do operador">

<input
id="novoUsuario"
placeholder="Usuário">

<input
id="novaSenha"
type="password"
placeholder="Senha">

<button
class="green"
onclick="adicionarOperador()">

➕ Adicionar operador

</button>

<button
class="gray"
onclick="pagina('caixa')">

Voltar

</button>

</div>


<div class="card">

<h3>
Operadores cadastrados
</h3>

${
operadores.map((o,i)=>`

<div class="item">

<span>

<b>
${o.nome}
</b>

<br>

<small>
Usuário: ${o.usuario}
</small>

</span>


${
o.usuario==="admin"
?
`
<span class="badge badge-yellow">
Administrador
</span>
`
:
`
<button
class="danger"
onclick="removerOperador(${i})">

Excluir

</button>
`
}

</div>

`)
.join("")
}

</div>

`;

}


/* =====================================================
   ADICIONAR OPERADOR
===================================================== */

function adicionarOperador(){

let nome =
document
.getElementById("novoNome")
.value
.trim();

let usuario =
document
.getElementById("novoUsuario")
.value
.trim();

let senha =
document
.getElementById("novaSenha")
.value;


if(!nome||!usuario||!senha){

alert(
"Preencha todos os campos."
);

return;

}


if(
operadores.some(
o=>o.usuario===usuario
)
){

alert(
"Esse usuário já existe."
);

return;

}


operadores.push({

nome:nome,

usuario:usuario,

senha:senha

});


salvar();


alert(
"✅ Operador adicionado."
);


gerenciarOperadores();

}


/* =====================================================
   REMOVER OPERADOR
===================================================== */

function removerOperador(i){

if(
operadores[i].usuario==="admin"
){

alert(
"O Administrador não pode ser excluído."
);

return;

}


if(
!confirm(
"Excluir o operador "+
operadores[i].nome+
"?"
)
)
return;


operadores.splice(
i,
1
);

salvar();

gerenciarOperadores();

}


/* =====================================================
   EXPORTAR VENDAS
===================================================== */

function exportar(){

let texto =
"ID;Data;Operador;Caixa;Pagamento;Total;Recebido;Troco;Cliente;Status;Motivo\n";


banco.vendas.forEach(v=>{

texto +=
`${v.id};`+
`${v.data};`+
`${v.operador};`+
`${v.caixaId||""};`+
`${v.pagamento};`+
`${v.total};`+
`${v.recebido};`+
`${v.troco};`+
`${v.cliente||""};`+
`${v.cancelada?"CANCELADA":"ATIVA"};`+
`${v.motivoCancelamento||""}\n`;

});


let blob =
new Blob(
["\ufeff"+texto],
{
type:"text/csv;charset=utf-8"
}
);


let url =
URL.createObjectURL(blob);

let a =
document.createElement("a");

a.href=url;

a.download=
"vendas-caixa-pro.csv";

document.body.appendChild(a);

a.click();

document.body.removeChild(a);

setTimeout(
()=>URL.revokeObjectURL(url),
1000
);


alert(
"Arquivo de vendas preparado."
);

}


/* =====================================================
   SALVAR DADOS
===================================================== */

salvar();

</script>

</body>
</html>
