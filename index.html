<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Caixa Pro">
<title>Caixa Pro</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
background:#f3f4f6;
color:#111827;
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
padding-bottom:90px;
-webkit-tap-highlight-color:transparent
}

header{
background:#111827;
color:white;
padding:25px 16px 15px;
position:sticky;
top:0;
z-index:5
}

header h1{margin:0;font-size:21px}
header small{opacity:.8}

main{
max-width:720px;
margin:auto;
padding:14px
}

.card{
background:white;
border-radius:16px;
padding:16px;
margin-bottom:12px;
box-shadow:0 2px 8px #0001
}

h2,h3{margin-top:0}

input,select,button{
width:100%;
padding:13px;
border-radius:11px;
border:1px solid #d1d5db;
font-size:16px;
background:white;
margin:5px 0;
font-family:inherit
}

button{
background:#111827;
color:white;
border:0;
font-weight:bold;
cursor:pointer
}

button:active{opacity:.75}

.danger{background:#dc2626}
.green{background:#16a34a}
.blue{background:#2563eb}
.gray{background:#e5e7eb;color:#111827}

.grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px
}

.valor{
font-size:24px;
font-weight:bold
}

.big{
font-size:30px;
font-weight:bold
}

.muted{color:#6b7280}
.center{text-align:center}

.item{
display:flex;
justify-content:space-between;
align-items:center;
gap:10px;
padding:12px 0;
border-bottom:1px solid #eee
}

.item:last-child{border-bottom:0}

.item button{
width:auto;
padding:8px 10px;
font-size:13px
}

.badge{
display:inline-block;
padding:4px 8px;
border-radius:8px;
font-size:12px;
font-weight:bold
}

.badge-green{
background:#dcfce7;
color:#166534
}

.badge-red{
background:#fee2e2;
color:#991b1b
}

.badge-yellow{
background:#fef3c7;
color:#92400e
}

.hidden{display:none}

hr{
border:0;
border-top:1px solid #eee;
margin:16px 0
}

nav{
position:fixed;
bottom:0;
left:0;
right:0;
background:white;
border-top:1px solid #ddd;
padding:8px;
display:grid;
grid-template-columns:repeat(5,1fr);
z-index:10
}

nav button{
background:white;
color:#374151;
font-size:11px;
margin:0;
padding:7px 2px
}

.notice{
padding:12px;
border-radius:10px;
background:#fef3c7;
color:#92400e;
margin:8px 0
}

.success{
padding:12px;
border-radius:10px;
background:#dcfce7;
color:#166534;
margin:8px 0
}

.stat{
background:#f9fafb;
border-radius:12px;
padding:12px
}

@media(max-width:420px){
.grid{grid-template-columns:1fr}
}
</style>
</head>

<body>

<!-- ================= LOGIN ================= -->

<div id="login" style="padding:35px 18px">

<div class="card">

<h1 class="center">🧾 Caixa Pro</h1>

<p class="center muted">
Controle completo de caixa
</p>

<input
id="usuario"
placeholder="Usuário"
autocomplete="username">

<input
id="senha"
type="password"
placeholder="Senha"
autocomplete="current-password">

<button onclick="entrar()">
Entrar
</button>

<p class="center muted">
Primeiro acesso: <b>admin</b> / <b>1234</b>
</p>

</div>

</div>


<!-- ================= APLICATIVO ================= -->

<div id="app" class="hidden">

<header>

<h1>🧾 Caixa Pro</h1>

<div id="operador"></div>

<small id="statusHeader"></small>

</header>

<main id="tela"></main>

<nav>

<button onclick="pagina('inicio')">
🏠<br>Início
</button>

<button onclick="pagina('venda')">
🛒<br>Venda
</button>

<button onclick="pagina('produtos')">
📦<br>Produtos
</button>

<button onclick="pagina('clientes')">
👥<br>Clientes
</button>

<button onclick="pagina('caixa')">
💰<br>Caixa
</button>

</nav>

</div>


<script>

/* =====================================================
   BANCO DE DADOS
===================================================== */

let banco =
JSON.parse(
localStorage.getItem("CAIXA_PRO") || "null"
) || {

produtos:[],
clientes:[],
vendas:[],
movimentos:[],
fechamentos:[],
caixa:null

};


/* =====================================================
   CORREÇÃO DE DADOS ANTIGOS
===================================================== */

if(!banco.produtos) banco.produtos=[];
if(!banco.clientes) banco.clientes=[];
if(!banco.vendas) banco.vendas=[];
if(!banco.movimentos) banco.movimentos=[];
if(!banco.fechamentos) banco.fechamentos=[];


/* =====================================================
   OPERADORES
===================================================== */

let operadores =
JSON.parse(
localStorage.getItem("CAIXA_OPERADORES") || "null"
) || [

{
nome:"Administrador",
usuario:"admin",
senha:"1234",
admin:true
}

];


/* =====================================================
   GARANTE ADMIN
===================================================== */

if(
!operadores.some(
o=>o.usuario==="admin"
)
){

operadores.unshift({

nome:"Administrador",
usuario:"admin",
senha:"1234",
admin:true

});

}


/* =====================================================
   VARIÁVEIS
===================================================== */

let usuarioAtual="";
let operadorAtual=null;
let carrinho=[];


/* =====================================================
   SALVAR
===================================================== */

function salvar(){

localStorage.setItem(
"CAIXA_PRO",
JSON.stringify(banco)
);

localStorage.setItem(
"CAIXA_OPERADORES",
JSON.stringify(operadores)
);

}


/* =====================================================
   DINHEIRO
===================================================== */

function dinheiro(valor){

return new Intl.NumberFormat(
"pt-BR",
{
style:"currency",
currency:"BRL"
}
).format(Number(valor)||0);

}


/* =====================================================
   ESCAPAR TEXTO
===================================================== */

function esc(txt){

return String(txt??"")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


/* =====================================================
   LOGIN
===================================================== */

function entrar(){

let u=
document.getElementById("usuario")
.value
.trim();

let s=
document.getElementById("senha")
.value;

let op=
operadores.find(
x=>x.usuario===u && x.senha===s
);

if(!op){

alert("Usuário ou senha incorretos.");

return;

}

usuarioAtual=op.nome;
operadorAtual=op;

document
.getElementById("login")
.classList.add("hidden");

document
.getElementById("app")
.classList.remove("hidden");

document
.getElementById("operador")
.innerText=
"Operador: "+usuarioAtual;

atualizarStatus();

pagina("inicio");

}


/* =====================================================
   STATUS
===================================================== */

function atualizarStatus(){

let status=
document.getElementById("statusHeader");

if(!status)return;

status.innerText=
banco.caixa
?
"🟢 Caixa aberto"
:
"🔴 Caixa fechado";

}


/* =====================================================
   NAVEGAÇÃO
===================================================== */

function pagina(p){

atualizarStatus();

if(p==="inicio") inicio();
if(p==="venda") venda();
if(p==="produtos") produtos();
if(p==="clientes") clientes();
if(p==="caixa") caixa();

}


/* =====================================================
   INÍCIO
===================================================== */

function inicio(){

let ativas=
banco.vendas.filter(
v=>!v.cancelada
);

let faturamento=
ativas.reduce(
(a,v)=>a+Number(v.total),
0
);

let dinheiroVendas=
ativas
.filter(v=>v.pagamento==="Dinheiro")
.reduce(
(a,v)=>a+Number(v.total),
0
);

let pix=
ativas
.filter(v=>v.pagamento==="Pix")
.reduce(
(a,v)=>a+Number(v.total),
0
);

let cartao=
ativas
.filter(v=>
v.pagamento==="Cartão de débito" ||
v.pagamento==="Cartão de crédito"
)
.reduce(
(a,v)=>a+Number(v.total),
0
);


tela.innerHTML=`

<div class="card">

<h2>📊 Resumo</h2>

<div class="grid">

<div class="stat">

<span class="muted">
Vendas
</span>

<div class="valor">
${ativas.length}
</div>

</div>

<div class="stat">

<span class="muted">
Faturamento
</span>

<div class="valor">
${dinheiro(faturamento)}
</div>

</div>

</div>

</div>


<div class="card">

<h3>💰 Status do Caixa</h3>

<h2>
${banco.caixa
?"🟢 ABERTO"
:"🔴 FECHADO"}
</h2>

${
banco.caixa
?
`
<p>
Troco inicial:
<b>${dinheiro(banco.caixa.inicial)}</b>
</p>

<button
class="blue"
onclick="pagina('venda')">

🛒 Nova venda

</button>
`
:
`
<div class="notice">
Abra o caixa antes de realizar vendas.
</div>

<button
class="green"
onclick="pagina('caixa')">

🔓 Abrir caixa

</button>
`
}

</div>


<div class="card">

<h3>💳 Vendas por pagamento</h3>

<div class="item">
<span>Dinheiro</span>
<b>${dinheiro(dinheiroVendas)}</b>
</div>

<div class="item">
<span>Pix</span>
<b>${dinheiro(pix)}</b>
</div>

<div class="item">
<span>Cartões</span>
<b>${dinheiro(cartao)}</b>
</div>

</div>


<div class="card">

<h3>🧾 Últimas vendas</h3>

${
banco.vendas
.slice(-10)
.reverse()
.map(v=>`

<div class="item">

<span>

<b>
${esc(v.pagamento)}
</b>

<br>

<small>
${new Date(v.data)
.toLocaleString("pt-BR")}
</small>

<br>

${
v.cancelada
?
`<span class="badge badge-red">
CANCELADA
</span>`
:
`<span class="badge badge-green">
ATIVA
</span>`
}

</span>

<span style="text-align:right">

<b>
${dinheiro(v.total)}
</b>

<br>

${
!v.cancelada
?
`
<button
class="danger"
onclick="cancelarVenda(${v.id})">

Cancelar

</button>
`
:
""
}

</span>

</div>

`)
.join("")
||
"<p class='muted'>Nenhuma venda.</p>"
}

</div>

`;

}


/* =====================================================
   VENDA
===================================================== */

function venda(){

let total=
carrinho.reduce(
(a,x)=>a+
(Number(x.preco)*Number(x.qtd)),
0
);

tela.innerHTML=`

<div class="card">

<h2>🛒 Nova Venda</h2>

${
!banco.caixa
?
`
<div class="notice">
O caixa está fechado.
</div>

<button
class="green"
onclick="pagina('caixa')">

Abrir caixa

</button>
`
:
""
}

<input
id="busca"
placeholder="Nome ou código do produto"
autocomplete="off">

<div class="grid">

<input
id="quantidade"
type="number"
value="1"
min="1">

<button
onclick="adicionar()">

Adicionar

</button>

</div>

</div>


<div class="card">

<h3>🛍️ Carrinho</h3>

${
carrinho.map((x,i)=>`

<div class="item">

<span>

<b>${esc(x.nome)}</b>

<br>

<small>
${x.qtd} × ${dinheiro(x.preco)}
</small>

</span>

<span style="text-align:right">

<b>
${dinheiro(x.preco*x.qtd)}
</b>

<br>

<button
class="danger"
onclick="remover(${i})">

Remover

</button>

</span>

</div>

`)
.join("")
||
"<p class='muted'>Carrinho vazio.</p>"
}

<hr>

<div class="big">
TOTAL: ${dinheiro(total)}
</div>

<br>

<label>
<strong>Forma de pagamento</strong>
</label>

<select id="pagamento"
onchange="atualizarPagamento()">

<option>Dinheiro</option>
<option>Pix</option>
<option>Cartão de débito</option>
<option>Cartão de crédito</option>
<option>Fiado</option>

</select>

<div id="areaDinheiro">

<input
id="recebido"
type="number"
step="0.01"
inputmode="decimal"
placeholder="Valor recebido">

<button
class="blue"
onclick="calcularTroco()">

💵 Calcular troco

</button>

<div
id="trocoVenda"
class="valor"
style="margin:12px 0">

Troco: R$ 0,00

</div>

</div>

<button
class="green"
onclick="finalizar()">

✅ Finalizar venda

</button>

</div>

`;


atualizarPagamento();

}


/* =====================================================
   ATUALIZA PAGAMENTO
===================================================== */

function atualizarPagamento(){

let pagamento=
document.getElementById("pagamento");

let area=
document.getElementById("areaDinheiro");

if(!pagamento||!area)return;

area.style.display=
pagamento.value==="Dinheiro"
?
"block"
:
"none";

}


/* =====================================================
   TROCO
===================================================== */

function calcularTroco(){

let total=
carrinho.reduce(
(a,x)=>a+x.preco*x.qtd,
0
);

let recebido=
parseFloat(
document.getElementById("recebido").value
)||0;

let troco=
recebido-total;

let campo=
document.getElementById("trocoVenda");

if(troco<0){

campo.innerText=
"Falta: "+dinheiro(Math.abs(troco));

return;

}

campo.innerText=
"Troco: "+dinheiro(troco);

}


/* =====================================================
   ADICIONAR PRODUTO
===================================================== */

function adicionar(){

if(!banco.caixa){

alert("Abra o caixa antes de vender.");

return;

}

let texto=
document
.getElementById("busca")
.value
.trim()
.toLowerCase();

let qtd=
Math.max(
1,
parseInt(
document
.getElementById("quantidade")
.value
)||1
);

if(!texto){

alert("Informe o produto.");

return;

}

let p=
banco.produtos.find(
x=>
x.nome.toLowerCase()===texto
||
String(x.codigo||"").toLowerCase()===texto
);

if(!p){

alert("Produto não encontrado.");

return;

}

if(Number(p.estoque)<qtd){

alert(
"Estoque insuficiente.\n\n"+
"Disponível: "+p.estoque
);

return;

}

let existente=
carrinho.find(
x=>x.id===p.id
);

if(existente){

if(
existente.qtd+qtd>
Number(p.estoque)
){

alert(
"Quantidade maior que o estoque."
);

return;

}

existente.qtd+=qtd;

}
else{

carrinho.push({

id:p.id,
nome:p.nome,
preco:Number(p.preco),
qtd:qtd

});

}

venda();

}


/* =====================================================
   REMOVER ITEM DO CARRINHO
===================================================== */

function remover(i){

carrinho.splice(i,1);

venda();

}


/* =====================================================
   FINALIZAR VENDA
===================================================== */

function finalizar(){

if(!banco.caixa){

alert(
"Abra o caixa antes de vender."
);

return;

}

if(!carrinho.length){

alert("Carrinho vazio.");

return;

}

let total=
carrinho.reduce(
(a,x)=>a+x.preco*x.qtd,
0
);

let pag=
document
.getElementById("pagamento")
.value;

let rec=
total;

let troco=0;

if(pag==="Dinheiro"){

rec=
parseFloat(
document
.getElementById("recebido")
.value
)||0;

if(rec<total){

alert(
"Valor recebido menor que o total."
);

return;

}

troco=rec-total;

}


let cliente="";

if(pag==="Fiado"){

cliente=
prompt("Nome do cliente:");

if(!cliente)return;

}


/* Confere estoque novamente */

for(let item of carrinho){

let p=
banco.produtos.find(
x=>x.id===item.id
);

if(!p||p.estoque<item.qtd){

alert(
"O estoque mudou.\n"+
"Confira os produtos."
);

return;

}

}


/* Itens */

let itens=
carrinho.map(x=>({

id:x.id,
nome:x.nome,
preco:x.preco,
qtd:x.qtd

}));


/* Baixa estoque */

carrinho.forEach(item=>{

let p=
banco.produtos.find(
x=>x.id===item.id
);

p.estoque-=item.qtd;

});


/* Venda */

let novaVenda={

id:Date.now(),

data:
new Date().toISOString(),

operador:
usuarioAtual,

caixaId:
banco.caixa.id,

total:
total,

pagamento:
pag,

recebido:
rec,

troco:
troco,

cliente:
cliente,

itens:
itens,

cancelada:false

};


banco.vendas.push(
novaVenda
);

salvar();


alert(
"✅ VENDA REALIZADA\n\n"+
"Total: "+dinheiro(total)+
"\nRecebido: "+dinheiro(rec)+
"\nTroco: "+dinheiro(troco)
);


carrinho=[];

pagina("venda");

}


/* =====================================================
   CANCELAR VENDA
===================================================== */

function cancelarVenda(id){

let v=
banco.vendas.find(
x=>x.id===id
);

if(!v){

alert("Venda não encontrada.");

return;

}

if(v.cancelada){

alert("Essa venda já está cancelada.");

return;

}


let motivo=
prompt(
"Informe o motivo do cancelamento:"
);

if(motivo===null)return;

motivo=motivo.trim();

if(!motivo){

alert(
"É necessário informar o motivo."
);

return;

}


let confirma=
confirm(
"⚠️ CONFIRMAR CANCELAMENTO?\n\n"+
"Total: "+dinheiro(v.total)+
"\nPagamento: "+v.pagamento+
"\n\nMotivo: "+motivo
);

if(!confirma)return;


/* Devolve estoque */

if(v.itens){

v.itens.forEach(item=>{

let p=
banco.produtos.find(
x=>x.id===item.id
);

if(p){

p.estoque=
Number(p.estoque)+
Number(item.qtd);

}

});

}


/* Marca cancelada */

v.cancelada=true;

v.motivoCancelamento=
motivo;

v.canceladaEm=
new Date().toISOString();

v.canceladaPor=
usuarioAtual;


salvar();


alert(
"❌ Venda cancelada.\n\n"+
"Os produtos foram devolvidos ao estoque."
);

inicio();

}


/* =====================================================
   PRODUTOS
===================================================== */

function produtos(){

tela.innerHTML=`

<div class="card">

<h2>📦 Produtos</h2>

<input
id="pnome"
placeholder="Nome do produto">

<input
id="pcodigo"
placeholder="Código de barras">

<input
id="ppreco"
type="number"
step="0.01"
inputmode="decimal"
placeholder="Preço de venda">

<input
id="pestoque"
type="number"
inputmode="numeric"
placeholder="Estoque">

<button
class="green"
onclick="cadastrarProduto()">

➕ Cadastrar produto

</button>

</div>


<div class="card">

<h3>
Produtos cadastrados:
${banco.produtos.length}
</h3>

${
banco.produtos
.map(p=>`

<div class="item">

<span>

<b>
${esc(p.nome)}
</b>

<br>

<small>
Código: ${esc(p.codigo||"-")}
<br>
Estoque: ${p.estoque}
</small>

</span>

<span style="text-align:right">

<b>
${dinheiro(p.preco)}
</b>

<br>

<button
onclick="editarProduto(${p.id})">

Editar

</button>

<button
class="danger"
onclick="removerProduto(${p.id})">

Excluir

</button>

</span>

</div>

`)
.join("")
||
"<p class='muted'>Nenhum produto cadastrado.</p>"
}

</div>

`;

}


/* =====================================================
   CADASTRAR PRODUTO
===================================================== */

function cadastrarProduto(){

let nome=
document
.getElementById("pnome")
.value
.trim();

let codigo=
document
.getElementById("pcodigo")
.value
.trim();

let preco=
parseFloat(
document
.getElementById("ppreco")
.value
);

let estoque=
parseInt(
document
.getElementById("pestoque")
.value
)||0;


if(!nome){

alert("Informe o nome.");

return;

}

if(!(preco>0)){

alert("Informe um preço válido.");

return;

}

if(estoque<0){

alert("Estoque inválido.");

return;

}


/* Evita código duplicado */

if(
codigo &&
banco.produtos.some(
p=>String(p.codigo)===codigo
)
){

alert(
"Já existe um produto com esse código."
);

return;

}


banco.produtos.push({

id:Date.now(),

nome:nome,

codigo:codigo,

preco:preco,

estoque:estoque

});


salvar();

alert(
"Produto cadastrado com sucesso."
);

produtos();

}


/* =====================================================
   EDITAR PRODUTO
===================================================== */

function editarProduto(id){

let p=
banco.produtos.find(
x=>x.id===id
);

if(!p)return;


let nome=
prompt(
"Nome do produto:",
p.nome
);

if(nome===null)return;


let codigo=
prompt(
"Código de barras:",
p.codigo||""
);

if(codigo===null)return;


let preco=
parseFloat(
prompt(
"Preço de venda:",
p.preco
)
);

if(!(preco>0)){

let usado=
banco.vendas.some(
v=>
v.itens &&
v.itens.some(

);


if(usado){

let confirmar=
confirm(

banco.produtos=

/* =====================================================
   CALCULAR SALDO DO CAIXA
===================================================== */

function calcularSaldoCaixa(){

if(!banco.caixa)return 0;

let saldo=
Number(banco.caixa.inicial)||0;


/* Vendas em dinheiro */

banco.vendas
.filter(v=>
!v.cancelada &&
v.pagamento==="Dinheiro" &&
v.caixaId===banco.caixa.id
)
.forEach(v=>{

/*
No caixa entra o valor efetivamente recebido.
*/

saldo+=
Number(v.recebido)||0;

});


/* Entradas e saídas */

banco.movimentos
.filter(
m=>m.caixaId===banco.caixa.id
)
.forEach(m=>{

if(m.tipo==="Entrada"){

saldo+=Number(m.valor)||0;

}
else{

saldo-=Number(m.valor)||0;

}

});


/*
Quando uma venda em dinheiro é cancelada,
o valor recebido precisa sair novamente do caixa.
*/

banco.vendas
.filter(v=>
v.cancelada &&
v.pagamento==="Dinheiro" &&
v.caixaId===banco.caixa.id
)
.forEach(v=>{

saldo-=
Number(v.recebido)||0;

});


return saldo;

}


/* =====================================================
   RESUMO DE VENDAS DO CAIXA
===================================================== */

function resumoCaixa(){

if(!banco.caixa){

return {

quantidade:0,
total:0,
dinheiro:0,
pix:0,
debito:0,
credito:0,
fiado:0

};

}

let lista=
banco.vendas.filter(
v=>
!v.cancelada &&
v.caixaId===banco.caixa.id
);


let resultado={

quantidade:lista.length,
total:0,
dinheiro:0,
pix:0,
debito:0,
credito:0,
fiado:0

};


lista.forEach(v=>{

resultado.total+=Number(v.total)||0;

if(v.pagamento==="Dinheiro")
resultado.dinheiro+=Number(v.total)||0;

if(v.pagamento==="Pix")
resultado.pix+=Number(v.total)||0;

if(v.pagamento==="Cartão de débito")
resultado.debito+=Number(v.total)||0;

if(v.pagamento==="Cartão de crédito")
resultado.credito+=Number(v.total)||0;

if(v.pagamento==="Fiado")
resultado.fiado+=Number(v.total)||0;

});


return resultado;

}

/* =====================================================
   FECHAR CAIXA
===================================================== */

function fecharCaixa(){

if(!banco.caixa){

alert("O caixa já está fechado.");

return;

}

let esperado=
calcularSaldoCaixa();

let campo=
document.getElementById("contado");

let contado=
parseFloat(campo.value);

if(isNaN(contado)||contado<0){

alert(
"Informe o dinheiro contado no caixa."
);

return;

}

let diferenca=
contado-esperado;


let confirmar=
confirm(
"🔒 CONFIRMAR FECHAMENTO?\n\n"+
"Esperado: "+dinheiro(esperado)+
"\nContado: "+dinheiro(contado)+
"\nDiferença: "+dinheiro(diferenca)
);

if(!confirmar)return;


let fechamento={

id:Date.now(),

caixaId:
banco.caixa.id,

abertura:
banco.caixa.abertura,

fechamento:
new Date().toISOString(),

operadorAbertura:
banco.caixa.operador,

operadorFechamento:
usuarioAtual,

inicial:
banco.caixa.inicial,

esperado:
esperado,

contado:
contado,

diferenca:
diferenca

};


banco.fechamentos.push(
fechamento
);

banco.caixa=null;

salvar();

atualizarStatus();


let texto=
diferenca===0
?
"CAIXA FECHADO SEM DIFERENÇA."
:
diferenca>0
?
"CAIXA FECHADO COM SOBRA."
:
"CAIXA FECHADO COM FALTA.";


alert(
"🔒 "+texto+
"\n\n"+
"Esperado: "+dinheiro(esperado)+
"\nContado: "+dinheiro(contado)+
"\nDiferença: "+dinheiro(diferenca)
);


caixa();

}

/* =====================================================
   EXPORTAR CSV
===================================================== */

function exportar(){

let texto=
"ID;Data;Operador;Caixa;Pagamento;Total;Recebido;Troco;Cliente;Status;Motivo\n";


banco.vendas.forEach(v=>{

texto+=
[
v.id,
v.data,
v.operador,
v.caixaId||"",
v.pagamento,
v.total,
v.recebido,
v.troco,
v.cliente||"",
v.cancelada?"CANCELADA":"ATIVA",
v.motivoCancelamento||""
]
.map(x=>
String(x)
.replace(/;/g,",")
)
.join(";")
+"\n";

});


let blob=
new Blob(
["\ufeff"+texto],
{
type:"text/csv;charset=utf-8"
}
);


let url=
URL.createObjectURL(blob);

let a=
document.createElement("a");

a.href=url;
a.download="vendas-caixa-pro.csv";

document.body.appendChild(a);

a.click();

a.remove();

setTimeout(
()=>URL.revokeObjectURL(url),
1000
);

}
